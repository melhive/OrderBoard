<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1E1B18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Order Board">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Order Board · Street Food Billing</title>
<style>
  :root{
    --paper:#FAF3E7;
    --paper-dim:#EFE6D6;
    --ink:#1E1B18;
    --line: rgba(30,27,24,0.14);
    --chili:#D64545;
    --chili-dark:#B23434;
    --leaf:#4B7B5B;
    --leaf-dark:#3C6249;
    --text-soft:#6B6560;
    --radius: 12px;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;

    --shell-bg:#1E1B18;
    --shell-bg-soft:#2A2521;
    --shell-text:#FAF3E7;
    --shell-text-dim: rgba(250,243,231,0.68);
    --shell-border: rgba(250,243,231,0.1);
    --accent-gold:#E8A33D;
    --accent-gold-line: rgba(232,163,61,0.25);
    --card-shadow: 0 4px 14px rgba(0,0,0,0.28);
  }
  body.theme-light{
    --shell-bg:#F4EEE1;
    --shell-bg-soft:#E9E0CC;
    --shell-text:#1E1B18;
    --shell-text-dim: rgba(30,27,24,0.6);
    --shell-border: rgba(30,27,24,0.12);
    --accent-gold:#A8691C;
    --accent-gold-line: rgba(168,105,28,0.28);
    --card-shadow: 0 4px 14px rgba(30,27,24,0.16);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family: var(--font-display);
    background: var(--shell-bg);
    color: var(--shell-text);
    overscroll-behavior: none;
    transition: background .18s ease, color .18s ease;
  }
  button{ font-family: inherit; cursor:pointer; }
  input{ font-family: inherit; }
  :focus-visible{ outline: 3px solid var(--accent-gold); outline-offset: 2px; }

  #app{ min-height:100%; display:flex; flex-direction:column; }

  .topbar{
    background: var(--shell-bg);
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--shell-border);
    position: sticky; top:0; z-index: 5;
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .topbar-actions{ display:flex; align-items:center; gap:8px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .kicker{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color: var(--accent-gold); font-weight:700; }
  .brand h1{ margin:0; font-size:22px; font-weight:800; letter-spacing:-0.02em; }
  .today-chip{ font-family: var(--font-mono); font-size:12px; background: var(--shell-bg-soft); border:1px solid var(--shell-border); padding:6px 10px; border-radius: 999px; color: var(--shell-text-dim); white-space:nowrap; }
  .back-btn{
    display:flex; align-items:center; gap:6px;
    background:none; border:none; color: var(--shell-text);
    font-size:15px; font-weight:700; padding:6px 4px 6px 0;
  }
  .back-btn span.arrow{ font-size:18px; }
  .theme-toggle{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background: var(--shell-bg-soft); border:1px solid var(--shell-border);
    color: var(--shell-text); font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .theme-toggle:active{ transform: scale(0.92); }

  main{ flex:1; padding: 16px 16px 24px; max-width: 720px; width:100%; margin:0 auto; }

  .grid-tables{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
  .ticket{
    background: var(--paper); color: var(--ink); border-radius: var(--radius);
    padding: 0 14px 16px; text-align:left; border: none; cursor:pointer;
    box-shadow: var(--card-shadow);
    display:flex; flex-direction:column; gap: 6px; min-height: 128px;
    position: relative; overflow:hidden;
  }
  .ticket.empty{ background: transparent; box-shadow:none; border: 1.5px dashed var(--shell-border); color: var(--shell-text-dim); }
  .ticket-name{
    font-size:19px; font-weight:800; letter-spacing:-0.01em; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; padding-right:22px;
  }
  .ticket-delete{
    position:absolute; top:8px; right:8px; z-index:2;
    width:26px; height:26px; border-radius:50%; border:none;
    background: rgba(30,27,24,0.08); color: var(--text-soft);
    font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .ticket-delete:active{ background: var(--chili); color: var(--paper); }
  .ticket.add-new{ align-items:center; justify-content:center; text-align:center; }
  .add-new-plus{ font-size:26px; font-weight:800; color: var(--accent-gold); line-height:1; }
  .add-new-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
  .ticket::before{
    content:""; display:block; height:12px; margin: 0 -14px 8px;
    background-image: radial-gradient(circle, var(--shell-bg) 3.2px, transparent 3.4px);
    background-size: 16px 12px; background-position: 4px 0;
  }
  .ticket.empty::before{ opacity:.5; }
  .ticket-label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color: var(--text-soft); }
  .ticket.empty .ticket-label{ color: var(--shell-text-dim); opacity:.8; }
  .ticket-num{ font-size:28px; font-weight:800; letter-spacing:-0.02em; line-height:1; }
  .ticket-status{ margin-top:auto; font-family: var(--font-mono); font-size:13px; color: var(--text-soft); }
  .ticket.occupied .ticket-status{ color: var(--ink); font-weight:700; font-size:20px; }
  .ticket.occupied{ border: 1.5px solid var(--chili); }
  .ticket-items-count{ font-family: var(--font-mono); font-size:12px; color: var(--text-soft); margin-top:2px; }

  .cat-label{
    font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:800;
    color: var(--accent-gold); margin: 22px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .cat-label:first-child{ margin-top:4px; }
  .cat-label::after{ content:""; flex:1; height:1px; background: var(--accent-gold-line); }

  .grid-menu{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu-tile{
    background: var(--shell-bg-soft); border: 1px solid var(--shell-border);
    border-radius: 10px; padding: 12px 12px; text-align:left; color: var(--shell-text);
    display:flex; flex-direction:column; gap: 6px; min-height: 64px;
    transition: transform .08s ease, background .12s ease;
  }
  .menu-tile:active{ transform: scale(0.96); background: var(--chili-dark); color:#fff; }
  .menu-tile .name{ font-size:14px; font-weight:700; line-height:1.25; }
  .menu-tile .price{ font-family: var(--font-mono); font-size:14px; color: var(--accent-gold); font-weight:700; }
  .menu-tile.custom{ border-style: dashed; align-items:center; justify-content:center; text-align:center; color: var(--shell-text-dim); }
  .menu-tile.custom .name{ font-size:13px; }

  main.order-main{ padding-bottom: 140px; }

  .split-bar{
    position: sticky; top: 73px; z-index: 4; background: var(--shell-bg);
    border-bottom: 1px solid var(--shell-border); padding: 10px 16px;
  }
  .split-bar-inner{ display:flex; gap:8px; overflow-x:auto; max-width:720px; margin:0 auto; }
  .split-chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    background: var(--shell-bg-soft); border:1px solid var(--shell-border); color: var(--shell-text-dim);
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap;
  }
  .split-chip.active{ background: var(--chili); border-color: var(--chili); color: var(--paper); }
  .split-remove-x{
    width:16px; height:16px; border-radius:50%; background: rgba(0,0,0,0.15);
    display:flex; align-items:center; justify-content:center; font-size:11px; margin-left:2px;
  }
  .split-add-chip{ color: var(--accent-gold); border-style:dashed; }
  .add-split-btn{
    background: var(--shell-bg-soft); border:1px solid var(--shell-border); color: var(--shell-text-dim);
    font-size:12px; font-weight:700; padding:8px 12px; border-radius:999px; white-space:nowrap;
  }

  .sheet-backdrop{
    position: fixed; inset:0; background: rgba(0,0,0,0.5); z-index: 20;
    opacity:0; pointer-events:none; transition: opacity .18s ease;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position: fixed; left:0; right:0; bottom:0; z-index: 21;
    background: var(--paper); color: var(--ink);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.35);
    max-width: 720px; margin: 0 auto;
    transform: translateY(calc(100% - 64px));
    transition: transform .22s cubic-bezier(.32,.72,0,1), bottom .18s ease;
    max-height: 86vh; display:flex; flex-direction:column;
  }
  .sheet.open{ transform: translateY(0); }
  .sheet-handle{
    padding: 10px 16px 8px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none; flex-shrink:0; position:relative;
  }
  .sheet-handle .grip{ width:36px; height:4px; background: rgba(30,27,24,0.2); border-radius:2px; margin:0 auto 8px; position:absolute; left:50%; top:6px; transform:translateX(-50%); }
  .sheet-summary-line{ display:flex; align-items:center; justify-content:space-between; width:100%; padding-top:6px; }
  .sheet-summary-line .count{ font-size:13px; color: var(--text-soft); font-weight:600; }
  .sheet-summary-line .amount{ font-family: var(--font-mono); font-size:22px; font-weight:800; }
  .sheet-summary-line .amount.bump{ animation: bump .22s ease; }
  @keyframes bump{ 0%{ transform:scale(1);} 40%{ transform:scale(1.12);} 100%{ transform:scale(1);} }

  .sheet-body{ overflow-y:auto; padding: 4px 16px 0; }
  .bill-line{
    display:flex; align-items:center; gap:10px; padding: 10px 0; border-bottom: 1px dashed var(--line);
    font-family: var(--font-mono); font-size:14px;
  }
  .bill-line .lname{ flex:1; font-family: var(--font-display); font-weight:600; font-size:14px; }
  .bill-line .lprice{ color: var(--text-soft); width:56px; text-align:right; }
  .qty-stepper{ display:flex; align-items:center; gap:6px; }
  .qty-stepper button{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background: var(--paper-dim);
    color: var(--ink); font-weight:800; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .qty-stepper .qty{ min-width:18px; text-align:center; font-weight:700; }
  .bill-line .lsubtotal{ width:52px; text-align:right; font-weight:700; }
  .bill-empty{ padding: 24px 0; text-align:center; color: var(--text-soft); font-size:14px; }

  .sheet-footer{ padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); flex-shrink:0; background: var(--paper); }
  .sheet-total-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .sheet-total-row .label{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color: var(--text-soft); font-weight:700; }
  .sheet-total-row .value{ font-family: var(--font-mono); font-size:26px; font-weight:800; }
  .cash-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .cash-input-wrap{ display:flex; align-items:center; flex:1; background: var(--paper-dim); border:1.5px solid var(--line); border-radius:8px; padding:0 10px; }
  .cash-currency{ font-family: var(--font-mono); color: var(--text-soft); font-size:15px; }
  .cash-input{ flex:1; border:none; background:none; padding:11px 6px; font-size:16px; font-family: var(--font-mono); color: var(--ink); min-width:0; }
  .cash-input:focus{ outline:none; }
  .change-display{ font-family: var(--font-mono); font-size:14px; font-weight:800; white-space:nowrap; min-width:0; }
  .change-display.ok{ color: var(--leaf); }
  .change-display.short{ color: var(--chili); }
  .sheet-actions{ display:flex; gap:10px; }
  .btn{ flex:1; border:none; border-radius:10px; padding:14px 10px; font-size:15px; font-weight:800; letter-spacing:.01em; }
  .btn:disabled{ opacity:.4; pointer-events:none; }
  .btn-primary{ background: var(--chili); color: var(--paper); }
  .btn-primary:active{ background: var(--chili-dark); }
  .btn-secondary{ background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn-secondary:active{ background: var(--paper-dim); }
  .btn-export{ background: var(--leaf); color: var(--paper); }
  .btn-export:active{ background: var(--leaf-dark); }
  .btn-outline-shell{ background: transparent; color: var(--shell-text); border: 1.5px solid var(--shell-border); }
  .btn-outline-shell:active{ background: var(--shell-bg-soft); }

  /* ---- Pop + Flash tap feedback on menu items ---- */
  @keyframes tile-pop-flash{
    0%{ transform:scale(1); background: var(--shell-bg-soft); }
    35%{ transform:scale(1.07); background: var(--chili); }
    100%{ transform:scale(1); background: var(--shell-bg-soft); }
  }
  @keyframes flash-name{ 0%,100%{ color: var(--shell-text); } 35%{ color:#fff; } }
  @keyframes flash-price{ 0%,100%{ color: var(--accent-gold); } 35%{ color:#fff; } }
  .menu-tile.pop-flash{ animation: tile-pop-flash .32s ease; }
  .menu-tile.pop-flash .name{ animation: flash-name .32s ease; }
  .menu-tile.pop-flash .price{ animation: flash-price .32s ease; }

  @media (prefers-reduced-motion: reduce){
    .sheet-summary-line .amount.bump{ animation:none; }
    .menu-tile{ transition:none; }
    .menu-tile.pop-flash, .menu-tile.pop-flash .name, .menu-tile.pop-flash .price{ animation:none; }
    body{ transition:none; }
  }

  .custom-form{ display:flex; flex-direction:column; gap:10px; padding: 6px 0 16px; }
  .custom-form label{ font-size:12px; font-weight:700; color: var(--text-soft); text-transform:uppercase; letter-spacing:.06em; }
  .custom-form input{
    width:100%; padding:12px 12px; border-radius:8px; border:1.5px solid var(--line);
    background: var(--paper-dim); color: var(--ink); font-size:16px;
  }
  .custom-form .row{ display:flex; gap:10px; }
  .custom-form .row > div{ flex:1; }

  .modal-backdrop{ position:fixed; inset:0; background: rgba(0,0,0,0.55); z-index: 40; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .modal-card{ background: var(--paper); color: var(--ink); border-radius: 14px; padding: 20px; max-width: 380px; width:100%; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  .modal-card h3{ margin:0 0 8px; font-size:17px; }
  .modal-card p{ margin:0 0 18px; font-size:14px; color: var(--text-soft); line-height:1.5; }
  .modal-actions{ display:flex; gap:10px; }

  .bottomnav{
    position: sticky; bottom:0; background: var(--shell-bg); border-top: 1px solid var(--shell-border);
    display:flex; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); gap:6px; z-index: 5;
  }
  .navbtn{
    flex:1; background:none; border:none; color: var(--shell-text-dim); padding:10px 6px; border-radius:10px;
    font-size:13px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .navbtn .ic{ font-size:18px; }
  .navbtn.active{ color: var(--accent-gold); }

  .summary-hero{ text-align:center; padding: 18px 0 8px; }
  .summary-hero .label{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color: var(--accent-gold); font-weight:800; }
  .summary-hero .value{ font-family: var(--font-mono); font-size:44px; font-weight:800; margin-top:4px; }
  .stat-row{ display:flex; gap:12px; margin: 18px 0 6px; }
  .stat-box{ flex:1; background: var(--shell-bg-soft); border:1px solid var(--shell-border); border-radius:10px; padding:12px; text-align:center; }
  .stat-box .n{ font-family: var(--font-mono); font-size:22px; font-weight:800; }
  .stat-box .l{ font-size:11px; color: var(--shell-text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  .best-list{ margin-top:8px; }
  .best-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--shell-border); }
  .best-row .rank{ font-family: var(--font-mono); font-size:13px; width:18px; color: var(--shell-text-dim); }
  .best-row .n{ flex:1; font-size:14px; font-weight:600; }
  .best-row .q{ font-family: var(--font-mono); font-size:13px; color: var(--accent-gold); font-weight:700; }

  .txn-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--shell-border); }
  .txn-row .time{ font-family: var(--font-mono); font-size:12px; color: var(--shell-text-dim); width:56px; }
  .txn-row .desc{ flex:1; font-size:13px; }
  .txn-row .desc b{ font-weight:700; }
  .txn-row .amt{ font-family: var(--font-mono); font-size:14px; font-weight:700; color: var(--leaf); }

  .empty-state{ text-align:center; color: var(--shell-text-dim); font-size:14px; padding: 30px 10px; line-height:1.6; }
  .summary-actions{ display:flex; gap:10px; margin: 22px 0 4px; }
  .hint-text{ text-align:center; color: var(--shell-text-dim); font-size:12px; margin-top:10px; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  .btn-full{ width:100%; margin-top:20px; }

  /* ---- Period tabs (Summary) ---- */
  .period-tabs{ display:flex; gap:6px; margin: 4px 0 2px; overflow-x:auto; }
  .period-tab{
    flex-shrink:0; padding:7px 14px; border-radius:999px; background: var(--shell-bg-soft);
    border:1px solid var(--shell-border); color: var(--shell-text-dim); font-size:13px; font-weight:700;
  }
  .period-tab.active{ background: var(--chili); border-color: var(--chili); color: var(--paper); }

  /* ---- Daily breakdown bars (Week/Month/All) ---- */
  .day-row{ display:flex; align-items:center; gap:10px; padding:8px 0; }
  .day-row .day-label{ width:58px; flex-shrink:0; font-size:12px; color: var(--shell-text-dim); font-family: var(--font-mono); }
  .day-row .day-bar-track{ flex:1; height:10px; background: var(--shell-bg-soft); border-radius:5px; overflow:hidden; }
  .day-row .day-bar-fill{ height:100%; background: var(--chili); border-radius:5px; }
  .day-row .day-amt{ width:64px; flex-shrink:0; text-align:right; font-family: var(--font-mono); font-size:12px; font-weight:700; }

  /* ---- Menu editor ---- */
  .menu-edit-intro{ font-size:13px; color: var(--shell-text-dim); line-height:1.5; margin-bottom:18px; }
  .menu-edit-cat{ background: var(--paper); color: var(--ink); border-radius: var(--radius); box-shadow: var(--card-shadow); padding:14px 16px; margin-bottom:14px; }
  .menu-edit-cat-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .menu-edit-cat-title{ font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; color: var(--accent-gold); }
  .menu-edit-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); }
  .menu-edit-row:last-of-type{ border-bottom:none; }
  .menu-edit-row .mi-name{ flex:1; font-size:14px; font-weight:600; }
  .menu-edit-row .mi-price{ font-family: var(--font-mono); font-size:14px; color: var(--text-soft); }
  .mi-delete{
    width:24px; height:24px; border-radius:50%; border:none; flex-shrink:0;
    background: rgba(30,27,24,0.08); color: var(--text-soft); font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .mi-delete:active{ background: var(--chili); color: var(--paper); }
  .menu-edit-add{
    width:100%; text-align:left; margin-top:8px; padding:9px 0; background:none; border:none;
    color: var(--chili); font-size:13px; font-weight:700;
  }

  @media (min-width: 700px){
    .grid-tables{ grid-template-columns: repeat(4, 1fr); }
    .grid-menu{ grid-template-columns: repeat(3, 1fr); }
    .stat-row{ max-width:480px; margin-left:auto; margin-right:auto; }
  }

  /* ---- Export format picker ---- */
  .export-options{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .export-option{
    background: var(--paper-dim); border: 1.5px solid var(--line); border-radius:10px;
    padding: 12px 14px; text-align:left; color: var(--ink);
  }
  .export-option:active{ background: var(--paper); border-color: var(--chili); }
  .eo-title{ font-size:15px; font-weight:800; }
  .eo-sub{ font-size:12px; color: var(--text-soft); margin-top:2px; }

  /* ---- Printable daily report ---- */
  .print-only{ display:none; }
  @page{ margin: 16mm 14mm; }
  @media print{
    body > #app{ display:none !important; }
    .print-only{
      display:block !important; background:#fff; color:#1E1B18;
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    .pr-header{ text-align:center; padding-bottom:14px; margin-bottom:20px; border-bottom: 3px solid #D64545; }
    .pr-brand{ font-size:24px; font-weight:800; letter-spacing:.01em; }
    .pr-date{ font-size:12px; color:#6B6560; margin-top:6px; }
    .pr-stats{ display:flex; justify-content:center; gap:40px; margin: 22px 0 30px; }
    .pr-stat{ text-align:center; }
    .pr-stat-n{ font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:22px; font-weight:800; }
    .pr-stat-l{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#6B6560; margin-top:3px; }
    .pr-section-title{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:#A8691C; margin:24px 0 8px; border-bottom:1px solid #E8DEC9; padding-bottom:7px; }
    .pr-table{ width:100%; border-collapse:collapse; font-size:12px; }
    .pr-table th{ text-align:left; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:#6B6560; padding:6px 8px; border-bottom:2px solid #1E1B18; }
    .pr-table td{ padding:7px 8px; border-bottom:1px solid #E8DEC9; page-break-inside: avoid; }
    .pr-table td.num, .pr-table th.num{ text-align:right; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .pr-total-row td{ font-weight:800; border-top:2px solid #1E1B18; border-bottom:none; }
    .pr-footer{ margin-top:34px; text-align:center; font-size:10px; color:#9a9187; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print-report" class="print-only"></div>
<input type="file" id="import-file-input" accept="application/json,.json" class="visually-hidden">

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "order_board_streetfood_v1";
  var DEFAULT_MENU = [
    { id:1, cat: "Pares", items: [
      { id:1, name: "Pares", price: 60 },
      { id:2, name: "Pares w/ Rice", price: 75 },
      { id:3, name: "Pares w/ Egg", price: 75 },
      { id:4, name: "Pares w/ Egg & Rice", price: 90 }
    ]},
    { id:2, cat: "Mami", items: [
      { id:5, name: "Mami", price: 50 },
      { id:6, name: "Mami w/ Rice", price: 65 },
      { id:7, name: "Mami w/ Egg", price: 65 },
      { id:8, name: "Mami w/ Egg & Rice", price: 90 }
    ]},
    { id:3, cat: "Pastil", items: [
      { id:9, name: "Pastil", price: 50 },
      { id:10, name: "Pastil w/ Egg", price: 65 }
    ]},
    { id:4, cat: "Siomai", items: [
      { id:11, name: "Siomai", price: 25 }
    ]},
    { id:5, cat: "Drinks", items: [
      { id:12, name: "Softdrinks", price: 25 },
      { id:13, name: "Water", price: 20 }
    ]},
    { id:6, cat: "Add-ons", items: [
      { id:14, name: "Rice", price: 15 },
      { id:15, name: "Egg", price: 15 }
    ]}
  ];
  var DEFAULT_TABLES = [
    { id:1, name:"1", custom:false },
    { id:2, name:"2", custom:false },
    { id:3, name:"3", custom:false },
    { id:4, name:"4", custom:false }
  ];

  var storageWorks = true;
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ storageWorks = false; }
    return null;
  }
  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(persistable()));
    }catch(e){ storageWorks = false; }
  }
  function persistable(){
    return {
      tables: state.tables, history: state.history, theme: state.theme,
      tableList: state.tableList, nextCustomId: state.nextCustomId,
      menu: state.menu, nextMenuCatId: state.nextMenuCatId, nextMenuItemId: state.nextMenuItemId
    };
  }
  // Older saved data stored each table as a flat item array. Newer format stores
  // each table as an array of "splits", each holding its own item array, so a
  // table can have one bill (the common case) or several separately-payable ones.
  function migrateTables(raw){
    var out = {};
    Object.keys(raw || {}).forEach(function(key){
      var val = raw[key];
      if(!Array.isArray(val) || val.length === 0){ out[key] = []; return; }
      if(val[0] && Object.prototype.hasOwnProperty.call(val[0], "items")){
        out[key] = val; // already new format
      } else {
        out[key] = [{ items: val }]; // old flat format -> becomes a single split
      }
    });
    return out;
  }

  var loaded = loadState();
  var state = {
    view: "tables",
    activeTable: null,
    activeSplit: 0,
    sheetOpen: false,
    modal: null,
    cashInput: "",
    summaryPeriod: "today",
    editingCat: null,
    theme: (loaded && loaded.theme) || "dark",
    tableList: (loaded && loaded.tableList) || DEFAULT_TABLES.slice(),
    nextCustomId: (loaded && loaded.nextCustomId) || 5,
    tables: migrateTables((loaded && loaded.tables) || { "1":[], "2":[], "3":[], "4":[] }),
    history: (loaded && loaded.history) || [],
    menu: (loaded && loaded.menu) || JSON.parse(JSON.stringify(DEFAULT_MENU)),
    nextMenuCatId: (loaded && loaded.nextMenuCatId) || 7,
    nextMenuItemId: (loaded && loaded.nextMenuItemId) || 16
  };
  document.body.classList.toggle("theme-light", state.theme === "light");

  function persist(){ saveState(); }

  function escapeHtml(s){
    return String(s)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }
  function peso(n){ return "\u20B1" + Math.round(n).toLocaleString(); }
  function tableSplits(id){ return state.tables[id] || []; }
  function splitTotal(split){
    return split.items.reduce(function(s,i){ return s + i.price*i.qty; }, 0);
  }
  function splitCount(split){
    return split.items.reduce(function(s,i){ return s + i.qty; }, 0);
  }
  function tableTotal(id){
    return tableSplits(id).reduce(function(sum, sp){ return sum + splitTotal(sp); }, 0);
  }
  function tableCount(id){
    return tableSplits(id).reduce(function(sum, sp){ return sum + splitCount(sp); }, 0);
  }
  function todayStr(){ return new Date().toDateString(); }
  function todaysHistory(){
    var t = todayStr();
    return state.history.filter(function(h){ return new Date(h.ts).toDateString() === t; });
  }
  function fmtTime(iso){
    var d = new Date(iso);
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if(h===0) h = 12;
    return h + ":" + (m<10?"0":"")+m + " " + ampm;
  }
  function pad2(n){ return (n<10?"0":"")+n; }

  function startOfWeek(d){
    var day = d.getDay();
    var diff = (day === 0 ? -6 : 1) - day;
    var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
    monday.setHours(0,0,0,0);
    return monday;
  }
  function startOfMonth(d){
    var m = new Date(d.getFullYear(), d.getMonth(), 1);
    m.setHours(0,0,0,0);
    return m;
  }
  function periodHistory(period){
    if(period === "today") return todaysHistory();
    if(period === "all") return state.history.slice();
    var now = new Date();
    var start = period === "week" ? startOfWeek(now) : startOfMonth(now);
    return state.history.filter(function(h){ return new Date(h.ts) >= start; });
  }
  function periodLabel(period){
    if(period === "today") return "Today\u2019s";
    if(period === "week") return "This Week\u2019s";
    if(period === "month") return "This Month\u2019s";
    return "All-Time";
  }
  function groupByDay(txns){
    var map = {};
    txns.forEach(function(h){
      var d = new Date(h.ts);
      var key = d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
      if(!map[key]) map[key] = { key:key, date:d, total:0, orders:0 };
      map[key].total += h.total;
      map[key].orders += 1;
    });
    return Object.keys(map).sort().reverse().map(function(k){ return map[k]; });
  }
  function fmtDayLabel(d){
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return days[d.getDay()] + " " + months[d.getMonth()] + " " + d.getDate();
  }

  function navigate(view, opts){
    state.view = view;
    state.modal = null;
    state.cashInput = "";
    state.activeSplit = 0;
    state.sheetOpen = false;
    if(opts && opts.table !== undefined) state.activeTable = opts.table;
    render();
    window.scrollTo(0,0);
  }
  function openTable(id){
    if(!state.tables[id] || state.tables[id].length === 0){
      state.tables[id] = [{ items: [] }];
    }
    navigate("order", { table: id });
  }
  function toggleSheet(){ state.sheetOpen = !state.sheetOpen; render(); }

  function toggleTheme(){
    state.theme = state.theme === "light" ? "dark" : "light";
    document.body.classList.toggle("theme-light", state.theme === "light");
    persist();
    render();
  }

  function addItem(tableId, name, price){
    var split = state.tables[tableId][state.activeSplit];
    var arr = split.items;
    var idx = -1;
    for(var i=0;i<arr.length;i++){ if(arr[i].name===name && arr[i].price===price){ idx=i; break; } }
    if(idx>=0) arr[idx].qty++;
    else arr.push({ name: name, price: price, qty: 1 });
    state.sheetOpen = true;
    persist();
    render();
    bumpTotal();
  }
  function changeQty(tableId, idx, delta){
    var split = state.tables[tableId][state.activeSplit];
    var arr = split.items;
    if(!arr[idx]) return;
    arr[idx].qty += delta;
    if(arr[idx].qty <= 0) arr.splice(idx,1);
    persist();
    render();
  }

  function addSplit(tableId){
    state.tables[tableId].push({ items: [] });
    state.activeSplit = state.tables[tableId].length - 1;
    state.cashInput = "";
    persist();
    render();
  }
  function switchSplit(idx){
    state.activeSplit = idx;
    state.cashInput = "";
    render();
  }
  function removeSplit(tableId, idx){
    var splits = state.tables[tableId];
    if(splits.length <= 1 || splits[idx].items.length) return;
    splits.splice(idx, 1);
    if(state.activeSplit >= splits.length) state.activeSplit = splits.length - 1;
    state.cashInput = "";
    persist();
    render();
  }

  function askClearTable(tableId){
    state.modal = { type:"confirm-clear", table: tableId };
    render();
  }
  function confirmClearTable(tableId){
    var split = state.tables[tableId][state.activeSplit];
    if(split) split.items = [];
    state.modal = null;
    state.cashInput = "";
    state.sheetOpen = false;
    persist();
    render();
  }
  function markPaid(tableId){
    var splits = state.tables[tableId];
    var split = splits[state.activeSplit];
    if(!split || !split.items.length) return;
    var total = splitTotal(split);
    state.history.push({
      id: Date.now(),
      table: tableId,
      items: split.items.map(function(i){ return { name:i.name, price:i.price, qty:i.qty }; }),
      total: total,
      ts: new Date().toISOString()
    });
    splits.splice(state.activeSplit, 1);
    state.cashInput = "";
    state.sheetOpen = false;
    if(splits.length === 0){
      persist();
      navigate("tables");
    } else {
      state.activeSplit = 0;
      persist();
      render();
    }
  }

  function openCustomForm(){ state.modal = { type:"custom-item" }; render(); }
  function closeModal(){ state.modal = null; render(); }
  function submitCustomItem(tableId){
    var nameEl = document.getElementById("ci-name");
    var priceEl = document.getElementById("ci-price");
    var name = (nameEl.value || "").trim();
    var price = parseFloat(priceEl.value);
    if(!name || isNaN(price) || price < 0){ return; }
    state.modal = null;
    addItem(tableId, name, price);
  }

  function openAddTableForm(){ state.modal = { type:"add-table" }; render(); }
  function submitAddTable(){
    var nameEl = document.getElementById("at-name");
    var name = (nameEl.value || "").trim();
    if(!name) return;
    var id = state.nextCustomId++;
    state.tableList.push({ id: id, name: name.slice(0,24), custom: true });
    state.tables[id] = [];
    state.modal = null;
    persist();
    render();
  }
  function askRemoveTable(id){
    var t = state.tableList.find(function(x){ return x.id === id; });
    if(!t || !t.custom || (state.tables[id]||[]).length) return;
    state.modal = { type:"confirm-remove-table", table: id, name: t.name };
    render();
  }
  function confirmRemoveTable(id){
    state.tableList = state.tableList.filter(function(t){ return t.id !== id; });
    delete state.tables[id];
    state.modal = null;
    persist();
    render();
  }

  // ---------- menu editor ----------
  function openMenuEditor(){ state.view = "menu"; state.modal = null; render(); window.scrollTo(0,0); }
  function closeMenuEditor(){ state.view = "tables"; render(); window.scrollTo(0,0); }

  function openAddCategoryForm(){ state.modal = { type:"add-category" }; render(); }
  function submitAddCategory(){
    var nameEl = document.getElementById("ac-name");
    var name = (nameEl.value || "").trim();
    if(!name) return;
    state.menu.push({ id: state.nextMenuCatId++, cat: name.slice(0,24), items: [] });
    state.modal = null;
    persist();
    render();
  }
  function deleteMenuCategory(catId){
    var cat = state.menu.find(function(c){ return c.id === catId; });
    if(!cat || cat.items.length) return;
    state.menu = state.menu.filter(function(c){ return c.id !== catId; });
    persist();
    render();
  }

  function openItemForm(catId, itemId){
    state.modal = { type:"menu-item-form", catId: catId, itemId: itemId || null };
    render();
  }
  function submitItemForm(){
    var m = state.modal;
    if(!m) return;
    var nameEl = document.getElementById("mi-name");
    var priceEl = document.getElementById("mi-price");
    var name = (nameEl.value || "").trim();
    var price = parseFloat(priceEl.value);
    if(!name || isNaN(price) || price < 0) return;
    var cat = state.menu.find(function(c){ return c.id === m.catId; });
    if(!cat) return;
    if(m.itemId){
      var it = cat.items.find(function(i){ return i.id === m.itemId; });
      if(it){ it.name = name.slice(0,40); it.price = price; }
    } else {
      cat.items.push({ id: state.nextMenuItemId++, name: name.slice(0,40), price: price });
    }
    state.modal = null;
    persist();
    render();
  }
  function deleteMenuItem(catId, itemId){
    var cat = state.menu.find(function(c){ return c.id === catId; });
    if(!cat) return;
    cat.items = cat.items.filter(function(i){ return i.id !== itemId; });
    state.modal = null;
    persist();
    render();
  }

  // ---------- full backup / restore ----------
  function exportAllData(){
    var now = new Date();
    var dateStr = now.getFullYear() + "-" + pad2(now.getMonth()+1) + "-" + pad2(now.getDate());
    var backup = persistable();
    backup._backupType = "order-board-full-backup";
    backup._exportedAt = now.toISOString();
    var blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "order_board_backup_" + dateStr + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function triggerImportFile(){
    var input = document.getElementById("import-file-input");
    if(input) input.click();
  }
  function handleImportFile(fileInput){
    var file = fileInput.files && fileInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ state.modal = { type:"import-error" }; render(); return; }
      if(!parsed || typeof parsed !== "object" || !("tables" in parsed) || !("history" in parsed)){
        state.modal = { type:"import-error" }; render(); return;
      }
      state.modal = { type:"confirm-restore", pending: parsed };
      render();
    };
    reader.onerror = function(){ state.modal = { type:"import-error" }; render(); };
    reader.readAsText(file);
    fileInput.value = "";
  }
  function confirmRestoreBackup(){
    var data = state.modal && state.modal.pending;
    if(!data) return;
    state.tables = migrateTables(data.tables || {});
    state.history = data.history || [];
    state.theme = data.theme || "dark";
    state.tableList = data.tableList || DEFAULT_TABLES.slice();
    state.nextCustomId = data.nextCustomId || 5;
    state.menu = data.menu || JSON.parse(JSON.stringify(DEFAULT_MENU));
    state.nextMenuCatId = data.nextMenuCatId || 7;
    state.nextMenuItemId = data.nextMenuItemId || 16;
    state.modal = null;
    document.body.classList.toggle("theme-light", state.theme === "light");
    persist();
    navigate("tables");
  }

  function computeDaySummary(txns){
    var total = txns.reduce(function(s,h){ return s+h.total; }, 0);
    var orders = txns.length;
    var itemsSold = 0;
    var tally = {};
    txns.forEach(function(h){
      h.items.forEach(function(it){
        itemsSold += it.qty;
        if(!tally[it.name]) tally[it.name] = { qty:0, revenue:0 };
        tally[it.name].qty += it.qty;
        tally[it.name].revenue += it.qty * it.price;
      });
    });
    var best = Object.keys(tally).map(function(k){
      return { name:k, qty: tally[k].qty, revenue: tally[k].revenue };
    }).sort(function(a,b){ return b.qty-a.qty; });
    return { total: total, orders: orders, itemsSold: itemsSold, best: best, txns: txns };
  }

  function askResetAll(){
    if(!todaysHistory().length) return;
    state.modal = { type:"confirm-reset" };
    render();
  }
  function confirmResetAll(){
    var t = todayStr();
    state.history = state.history.filter(function(h){ return new Date(h.ts).toDateString() !== t; });
    state.modal = null;
    persist();
    render();
  }

  function exportCSV(){
    var period = state.summaryPeriod;
    var txns = periodHistory(period);
    if(!txns.length) return;
    var summary = computeDaySummary(txns);
    var now = new Date();
    var dateStr = now.getFullYear() + "-" + pad2(now.getMonth()+1) + "-" + pad2(now.getDate());
    var titleWord = period === "today" ? "Daily" : period === "week" ? "Weekly" : period === "month" ? "Monthly" : "All-Time";

    var rows = [];
    rows.push(["Order Board - " + titleWord + " Sales Report"]);
    rows.push(["Generated", dateStr]);
    rows.push([]);
    rows.push(["SUMMARY"]);
    rows.push(["Total Earnings (PHP)", summary.total]);
    rows.push(["Orders", summary.orders]);
    rows.push(["Items Sold", summary.itemsSold]);
    rows.push([]);
    rows.push(["BEST SELLERS"]);
    rows.push(["Item", "Qty Sold", "Revenue (PHP)"]);
    summary.best.forEach(function(b){ rows.push([b.name, b.qty, b.revenue]); });
    rows.push([]);
    if(period === "today"){
      rows.push(["TRANSACTIONS"]);
      rows.push(["Time", "Table", "Items", "Total (PHP)"]);
      summary.txns.forEach(function(h){
        var itemsStr = h.items.map(function(i){ return i.qty + "x " + i.name; }).join("; ");
        rows.push([fmtTime(h.ts), "Table " + h.table, itemsStr, h.total]);
      });
    } else {
      rows.push(["DAILY BREAKDOWN"]);
      rows.push(["Date", "Orders", "Total (PHP)"]);
      groupByDay(txns).forEach(function(day){
        rows.push([fmtDayLabel(day.date), day.orders, day.total]);
      });
    }
    rows.push(["", "", "TOTAL", summary.total]);

    var csv = rows.map(function(r){
      return r.map(function(f){ return '"' + String(f).replace(/"/g,'""') + '"'; }).join(",");
    }).join("\r\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "streetfood_" + period + "_report_" + dateStr + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function exportPDF(){
    var period = state.summaryPeriod;
    var txns = periodHistory(period);
    if(!txns.length) return;
    var summary = computeDaySummary(txns);
    var now = new Date();
    var dateStr = now.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
    var genStr = now.toLocaleString(undefined, { hour:"numeric", minute:"2-digit" });
    var titleWord = period === "today" ? "Daily" : period === "week" ? "Weekly" : period === "month" ? "Monthly" : "All-Time";

    var bestRows = summary.best.length
      ? summary.best.map(function(b,i){
          return '<tr><td>' + (i+1) + '</td><td>' + escapeHtml(b.name) + '</td><td class="num">' + b.qty + '</td><td class="num">' + peso(b.revenue) + '</td></tr>';
        }).join("")
      : '<tr><td colspan="4" style="text-align:center;color:#9a9187;">No sales recorded</td></tr>';

    var detailTitle, detailTable;
    if(period === "today"){
      var txnRows = summary.txns.map(function(h){
        var itemsStr = h.items.map(function(i){ return i.qty + "x " + escapeHtml(i.name); }).join(", ");
        return '<tr><td>' + fmtTime(h.ts) + '</td><td>Table ' + h.table + '</td><td>' + itemsStr + '</td><td class="num">' + peso(h.total) + '</td></tr>';
      }).join("");
      detailTitle = "Transactions";
      detailTable = '<table class="pr-table"><thead><tr><th>Time</th><th>Table</th><th>Items</th><th class="num">Total</th></tr></thead><tbody>' + txnRows + '</tbody></table>';
    } else {
      var dayRows = groupByDay(txns).map(function(day){
        return '<tr><td>' + fmtDayLabel(day.date) + '</td><td class="num">' + day.orders + '</td><td class="num">' + peso(day.total) + '</td></tr>';
      }).join("");
      detailTitle = "Daily Breakdown";
      detailTable = '<table class="pr-table"><thead><tr><th>Date</th><th class="num">Orders</th><th class="num">Total</th></tr></thead><tbody>' + dayRows + '</tbody></table>';
    }

    var reportHtml =
      '<div class="pr-header">' +
        '<div class="pr-brand">' + titleWord + ' Sales Report</div>' +
        '<div class="pr-date">' + dateStr + '</div>' +
      '</div>' +
      '<div class="pr-stats">' +
        '<div class="pr-stat"><div class="pr-stat-n">' + peso(summary.total) + '</div><div class="pr-stat-l">Total Earnings</div></div>' +
        '<div class="pr-stat"><div class="pr-stat-n">' + summary.orders + '</div><div class="pr-stat-l">Orders</div></div>' +
        '<div class="pr-stat"><div class="pr-stat-n">' + summary.itemsSold + '</div><div class="pr-stat-l">Items Sold</div></div>' +
      '</div>' +
      '<div class="pr-section-title">Best Sellers</div>' +
      '<table class="pr-table"><thead><tr><th>#</th><th>Item</th><th class="num">Qty</th><th class="num">Revenue</th></tr></thead><tbody>' + bestRows + '</tbody></table>' +
      '<div class="pr-section-title">' + detailTitle + '</div>' +
      detailTable +
      '<div class="pr-footer">Generated ' + genStr + ' &middot; Order Board</div>';

    document.getElementById("print-report").innerHTML = reportHtml;
    window.print();
  }

  function bumpTotal(){
    requestAnimationFrame(function(){
      var el = document.querySelector(".sheet-summary-line .amount");
      if(el){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    });
  }

  function renderThemeToggle(){
    var icon = state.theme === "light" ? "\u2600\uFE0F" : "\uD83C\uDF19";
    return '<button class="theme-toggle" data-act="toggle-theme" aria-label="Toggle light or dark mode">' + icon + '</button>';
  }

  function renderTablesScreen(){
    var todayTotal = todaysHistory().reduce(function(s,h){ return s+h.total; }, 0);
    var cards = state.tableList.map(function(t){
      var count = tableCount(t.id);
      var occupied = count > 0;
      var canDelete = t.custom && !occupied;
      var titleHtml = t.custom
        ? '<div class="ticket-name">' + escapeHtml(t.name) + '</div>'
        : '<div class="ticket-label">Table</div><div class="ticket-num">' + escapeHtml(t.name) + '</div>';
      return '<div class="ticket ' + (occupied?"occupied":"empty") + '" data-act="open-table" data-table="' + t.id + '">' +
        (canDelete ? '<button class="ticket-delete" data-act="ask-remove-table" data-table="' + t.id + '" aria-label="Remove table">\u00d7</button>' : '') +
        titleHtml +
        (occupied
          ? '<div class="ticket-status">' + peso(tableTotal(t.id)) + '</div><div class="ticket-items-count">' + count + ' item' + (count!==1?'s':'') + '</div>'
          : '<div class="ticket-status">Empty · tap to start</div>') +
        '</div>';
    }).join("");

    cards += '<div class="ticket empty add-new" data-act="open-add-table">' +
      '<div class="add-new-plus">+</div><div class="add-new-label">Add Table</div>' +
    '</div>';

    return (
      '<div class="topbar"><div class="topbar-row">' +
        '<div class="brand"><div class="kicker">murthehelp</div><h1>Order Board</h1></div>' +
        '<div class="topbar-actions">' + renderThemeToggle() + '<button class="theme-toggle" data-act="open-menu-editor" aria-label="Edit menu">\u270E</button><div class="today-chip">Today ' + peso(todayTotal) + '</div></div>' +
      '</div></div>' +
      '<main><div class="grid-tables">' + cards + '</div></main>' +
      renderNav("tables") +
      renderModal()
    );
  }

  function renderMenuScreen(){
    var catsHtml = state.menu.map(function(cat){
      var itemsHtml = cat.items.map(function(it){
        return '<div class="menu-edit-row">' +
          '<div class="mi-name" data-act="edit-menu-item" data-cat="' + cat.id + '" data-item="' + it.id + '">' + escapeHtml(it.name) + '</div>' +
          '<div class="mi-price">' + peso(it.price) + '</div>' +
          '<button class="mi-delete" data-act="delete-menu-item" data-cat="' + cat.id + '" data-item="' + it.id + '" aria-label="Delete item">\u00d7</button>' +
        '</div>';
      }).join("");
      var canDeleteCat = cat.items.length === 0;
      return '<div class="menu-edit-cat">' +
        '<div class="menu-edit-cat-head">' +
          '<div class="menu-edit-cat-title">' + escapeHtml(cat.cat) + '</div>' +
          (canDeleteCat ? '<button class="mi-delete" data-act="delete-menu-cat" data-cat="' + cat.id + '" aria-label="Delete category">\u00d7</button>' : '') +
        '</div>' +
        itemsHtml +
        '<button class="menu-edit-add" data-act="add-menu-item" data-cat="' + cat.id + '">+ Add item to ' + escapeHtml(cat.cat) + '</button>' +
      '</div>';
    }).join("");

    return (
      '<div class="topbar"><div class="topbar-row">' +
        '<button class="back-btn" data-act="close-menu-editor"><span class="arrow">‹</span> Tables</button>' +
        '<div class="topbar-actions">' + renderThemeToggle() + '</div>' +
      '</div></div>' +
      '<main>' +
        '<div class="menu-edit-intro">Edit prices, add items, or create new categories. Changes apply immediately on the order screen.</div>' +
        catsHtml +
        '<button class="btn btn-outline-shell btn-full" data-act="open-add-category">+ Add Category</button>' +
      '</main>' +
      renderModal()
    );
  }

  function renderOrderScreen(){
    var id = state.activeTable;
    var splits = state.tables[id] || [{items:[]}];
    if(state.activeSplit >= splits.length) state.activeSplit = 0;
    var activeIdx = state.activeSplit;
    var activeSplitObj = splits[activeIdx];
    var hasMultiple = splits.length > 1;
    var activeTotal = splitTotal(activeSplitObj);
    var activeCount = splitCount(activeSplitObj);

    var menuHtml = state.menu.map(function(group){
      var tiles = group.items.map(function(it){
        return '<button class="menu-tile" data-act="add-item" data-table="' + id + '" data-name="' + escapeHtml(it.name) + '" data-price="' + it.price + '">' +
          '<div class="name">' + escapeHtml(it.name) + '</div><div class="price">' + peso(it.price) + '</div></button>';
      }).join("");
      return '<div class="cat-label">' + group.cat + '</div><div class="grid-menu">' + tiles + '</div>';
    }).join("");

    menuHtml += '<div class="cat-label">Other</div><div class="grid-menu">' +
      '<button class="menu-tile custom" data-act="open-custom"><div class="name">+ Custom item</div></button>' +
      '</div>';

    var splitBarHtml = "";
    if(hasMultiple){
      var chips = splits.map(function(sp, i){
        var canRemove = splits.length > 1 && sp.items.length === 0;
        return '<div class="split-chip ' + (i===activeIdx?"active":"") + '" data-act="switch-split" data-idx="' + i + '">' +
          'Split ' + (i+1) +
          (canRemove ? '<span class="split-remove-x" data-act="remove-split" data-table="' + id + '" data-idx="' + i + '">\u00d7</span>' : '') +
        '</div>';
      }).join("");
      splitBarHtml = '<div class="split-bar"><div class="split-bar-inner">' + chips +
        '<div class="split-chip split-add-chip" data-act="add-split" data-table="' + id + '">+ Split</div>' +
      '</div></div>';
    }

    var billLines = activeSplitObj.items.length
      ? activeSplitObj.items.map(function(it, idx){
          return '<div class="bill-line">' +
            '<div class="lname">' + escapeHtml(it.name) + '</div>' +
            '<div class="lprice">' + peso(it.price) + '</div>' +
            '<div class="qty-stepper">' +
              '<button data-act="qty-down" data-table="' + id + '" data-idx="' + idx + '" aria-label="Remove one">\u2212</button>' +
              '<div class="qty">' + it.qty + '</div>' +
              '<button data-act="qty-up" data-table="' + id + '" data-idx="' + idx + '" aria-label="Add one">+</button>' +
            '</div>' +
            '<div class="lsubtotal">' + peso(it.price*it.qty) + '</div>' +
          '</div>';
        }).join("")
      : '<div class="bill-empty">No items yet — tap the menu above to add.</div>';

    var cashNum = parseFloat(state.cashInput);
    var changeText = "", changeClass = "";
    if(state.cashInput !== "" && !isNaN(cashNum)){
      var change = cashNum - activeTotal;
      if(change < 0){ changeText = "Short " + peso(Math.abs(change)); changeClass = "short"; }
      else { changeText = "Change " + peso(change); changeClass = "ok"; }
    }

    var clearLabel = hasMultiple ? "Clear split" : "Clear table";
    var addSplitTopBtn = !hasMultiple
      ? '<button class="add-split-btn" data-act="add-split" data-table="' + id + '">+ Split</button>'
      : '';
    var countLabel = hasMultiple
      ? (activeCount + ' item' + (activeCount!==1?'s':'') + ' · Split ' + (activeIdx+1))
      : (activeCount + ' item' + (activeCount!==1?'s':'') + ' · Table ' + id);

    return (
      '<div class="topbar"><div class="topbar-row">' +
        '<button class="back-btn" data-act="go-tables"><span class="arrow">‹</span> Tables</button>' +
        '<div class="topbar-actions">' + renderThemeToggle() + addSplitTopBtn + '<div class="today-chip">Table ' + id + '</div></div>' +
      '</div></div>' +
      splitBarHtml +
      '<main class="order-main">' + menuHtml + '</main>' +
      '<div class="sheet-backdrop ' + (state.sheetOpen?"open":"") + '" data-act="toggle-sheet"></div>' +
      '<div class="sheet ' + (state.sheetOpen?"open":"") + '">' +
        '<div class="grip"></div>' +
        '<div class="sheet-handle" data-act="toggle-sheet">' +
          '<div class="sheet-summary-line">' +
            '<div class="count">' + countLabel + '</div>' +
            '<div class="amount">' + peso(activeTotal) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="sheet-body">' + billLines + '</div>' +
        '<div class="sheet-footer">' +
          '<div class="sheet-total-row"><div class="label">Total</div><div class="value">' + peso(activeTotal) + '</div></div>' +
          '<div class="cash-row">' +
            '<div class="cash-input-wrap">' +
              '<span class="cash-currency">\u20B1</span>' +
              '<input type="number" inputmode="decimal" min="0" class="cash-input" placeholder="Cash received" value="' + escapeHtml(state.cashInput) + '" data-act="cash-input">' +
            '</div>' +
            '<div class="change-display ' + changeClass + '">' + changeText + '</div>' +
          '</div>' +
          '<div class="sheet-actions">' +
            '<button class="btn btn-secondary" data-act="ask-clear" data-table="' + id + '">' + clearLabel + '</button>' +
            '<button class="btn btn-primary" data-act="mark-paid" data-table="' + id + '">Paid ✓</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      renderModal()
    );
  }

  function renderSummaryScreen(){
    var period = state.summaryPeriod;
    var txns = periodHistory(period);
    var summary = computeDaySummary(txns);
    var best = summary.best.slice(0,5);

    var bestHtml = best.length
      ? best.map(function(b,i){
          return '<div class="best-row"><div class="rank">' + (i+1) + '</div><div class="n">' + escapeHtml(b.name) + '</div><div class="q">×' + b.qty + '</div></div>';
        }).join("")
      : '<div class="empty-state">No sales in this period yet.</div>';

    var detailHtml;
    if(period === "today"){
      var txnsDesc = txns.slice().reverse();
      detailHtml = txnsDesc.length
        ? '<div class="cat-label">Transactions</div><div>' + txnsDesc.map(function(h){
            return '<div class="txn-row"><div class="time">' + fmtTime(h.ts) + '</div>' +
              '<div class="desc"><b>Table ' + h.table + '</b> · ' + h.items.reduce(function(s,i){return s+i.qty;},0) + ' items</div>' +
              '<div class="amt">' + peso(h.total) + '</div></div>';
          }).join("") + '</div>'
        : "";
    } else {
      var days = groupByDay(txns);
      var maxDay = days.reduce(function(m,d){ return Math.max(m, d.total); }, 1);
      detailHtml = days.length
        ? '<div class="cat-label">Daily Breakdown</div><div>' + days.map(function(d){
            var pct = Math.round((d.total / maxDay) * 100);
            return '<div class="day-row">' +
              '<div class="day-label">' + fmtDayLabel(d.date) + '</div>' +
              '<div class="day-bar-track"><div class="day-bar-fill" style="width:' + pct + '%"></div></div>' +
              '<div class="day-amt">' + peso(d.total) + '</div>' +
            '</div>';
          }).join("") + '</div>'
        : "";
    }

    var total = summary.total, orders = summary.orders, itemsSold = summary.itemsSold;
    var hasHistory = orders > 0;
    var hasTodayHistory = todaysHistory().length > 0;

    var periods = [["today","Today"],["week","Week"],["month","Month"],["all","All Time"]];
    var periodTabsHtml = '<div class="period-tabs">' + periods.map(function(p){
      return '<button class="period-tab ' + (period===p[0]?"active":"") + '" data-act="set-period" data-period="' + p[0] + '">' + p[1] + '</button>';
    }).join("") + '</div>';

    return (
      '<div class="topbar"><div class="topbar-row">' +
        '<div class="brand"><div class="kicker">' + todayStr() + '</div><h1>Summary</h1></div>' +
        '<div class="topbar-actions">' + renderThemeToggle() + '</div>' +
      '</div></div>' +
      '<main>' +
        periodTabsHtml +
        '<div class="summary-hero"><div class="label">' + periodLabel(period) + ' Earnings</div><div class="value">' + peso(total) + '</div></div>' +
        '<div class="stat-row">' +
          '<div class="stat-box"><div class="n">' + orders + '</div><div class="l">Orders</div></div>' +
          '<div class="stat-box"><div class="n">' + itemsSold + '</div><div class="l">Items Sold</div></div>' +
        '</div>' +
        '<div class="cat-label">Best Sellers</div>' +
        '<div class="best-list">' + bestHtml + '</div>' +
        detailHtml +
        '<div class="cat-label">Reports</div>' +
        '<div class="summary-actions">' +
          '<button class="btn btn-export" data-act="open-export" ' + (hasHistory?'':'disabled') + '>Export</button>' +
          '<button class="btn btn-outline-shell" data-act="ask-reset" ' + (hasTodayHistory?'':'disabled') + '>Reset Today</button>' +
        '</div>' +
        (hasHistory ? '' : '<div class="hint-text">No sales recorded in this period — nothing to export.</div>') +
        '<div class="cat-label">Backup</div>' +
        '<div class="summary-actions">' +
          '<button class="btn btn-outline-shell" data-act="export-all-data">Export All Data</button>' +
          '<button class="btn btn-outline-shell" data-act="trigger-import">Import Backup</button>' +
        '</div>' +
        '<div class="hint-text">Full backup of every table, sale, and menu item — separate from the reports above. Keep a copy off your phone.</div>' +
      '</main>' +
      renderNav("summary") +
      renderModal()
    );
  }

  function renderNav(active){
    return '<div class="bottomnav">' +
      '<button class="navbtn ' + (active==="tables"?"active":"") + '" data-act="go-tables"><span class="ic">▦</span>Tables</button>' +
      '<button class="navbtn ' + (active==="summary"?"active":"") + '" data-act="go-summary"><span class="ic">☰</span>Summary</button>' +
    '</div>';
  }

  function renderModal(){
    if(!state.modal) return "";
    if(state.modal.type === "confirm-clear"){
      var tid = state.modal.table;
      var tSplits = state.tables[tid] || [];
      var isMulti = tSplits.length > 1;
      var clearTitle = isMulti ? ("Clear Split " + (state.activeSplit+1) + "?") : ("Clear Table " + tid + "?");
      var clearBody = isMulti
        ? "This removes all items on this split without recording a sale."
        : "This removes all items on this table without recording a sale. Use this if the order was a mistake or the table left without ordering.";
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>' + clearTitle + '</h3>' +
          '<p>' + clearBody + '</p>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-act="close-modal">Cancel</button>' +
            '<button class="btn btn-primary" data-act="confirm-clear" data-table="' + tid + '">Clear</button>' +
          '</div>' +
        '</div></div>';
    }
    if(state.modal.type === "custom-item"){
      var tableId = state.activeTable;
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>Add custom item</h3>' +
          '<div class="custom-form">' +
            '<div><label for="ci-name">Item name</label><input id="ci-name" type="text" placeholder="e.g. Extra rice" autofocus></div>' +
            '<div><label for="ci-price">Price (\u20B1)</label><input id="ci-price" type="number" inputmode="decimal" min="0" placeholder="0"></div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-act="close-modal">Cancel</button>' +
            '<button class="btn btn-primary" data-act="submit-custom" data-table="' + tableId + '">Add</button>' +
          '</div>' +
        '</div></div>';
    }
    if(state.modal.type === "add-table"){
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>Add a table</h3>' +
          '<div class="custom-form">' +
            '<div><label for="at-name">Name</label><input id="at-name" type="text" placeholder="e.g. Takeout" autofocus maxlength="24"></div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-act="close-modal">Cancel</button>' +
            '<button class="btn btn-primary" data-act="submit-add-table">Add</button>' +
          '</div>' +
        '</div></div>';
    }
    if(state.modal.type === "confirm-remove-table"){
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>Remove "' + escapeHtml(state.modal.name) + '"?</h3>' +
          '<p>This removes the table from your board. You can add it again anytime.</p>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-act="close-modal">Cancel</button>' +
            '<button class="btn btn-primary" data-act="confirm-remove-table" data-table="' + state.modal.table + '">Remove</button>' +
          '</div>' +
        '</div></div>';
    }
    if(state.modal.type === "confirm-reset"){
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>Reset today\u2019s sales?</h3>' +
          '<p>This clears today\u2019s recorded sales so you can start fresh tomorrow. Export today\u2019s report first if you want to keep a record — this can\u2019t be undone.</p>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-act="close-modal">Cancel</button>' +
            '<button class="btn btn-primary" data-act="confirm-reset">Reset</button>' +
          '</div>' +
        '</div></div>';
    }
    if(state.modal.type === "export-menu"){
      var expLabel = periodLabel(state.summaryPeriod);
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>Export ' + expLabel + ' Report</h3>' +
          '<p>Choose a format.</p>' +
          '<div class="export-options">' +
            '<button class="export-option" data-act="do-export-csv">' +
              '<div class="eo-title">CSV</div><div class="eo-sub">Spreadsheet &mdash; opens in Google Sheets or Excel</div>' +
            '</button>' +
            '<button class="export-option" data-act="do-export-pdf">' +
              '<div class="eo-title">PDF</div><div class="eo-sub">Printable report &mdash; save or share as PDF</div>' +
            '</button>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-act="close-modal">Cancel</button>' +
          '</div>' +
        '</div></div>';
    }
    if(state.modal.type === "add-category"){
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>Add a category</h3>' +
          '<div class="custom-form">' +
            '<div><label for="ac-name">Category name</label><input id="ac-name" type="text" placeholder="e.g. Rice Meals" autofocus maxlength="24"></div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-act="close-modal">Cancel</button>' +
            '<button class="btn btn-primary" data-act="submit-add-category">Add</button>' +
          '</div>' +
        '</div></div>';
    }
    if(state.modal.type === "menu-item-form"){
      var m = state.modal;
      var cat = state.menu.find(function(c){ return c.id === m.catId; });
      var editing = m.itemId ? cat.items.find(function(i){ return i.id === m.itemId; }) : null;
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>' + (editing ? "Edit item" : "Add item") + (cat ? (" \u2014 " + escapeHtml(cat.cat)) : "") + '</h3>' +
          '<div class="custom-form">' +
            '<div><label for="mi-name">Item name</label><input id="mi-name" type="text" placeholder="e.g. Pares w/ Sisig" autofocus value="' + (editing ? escapeHtml(editing.name) : "") + '"></div>' +
            '<div><label for="mi-price">Price (\u20B1)</label><input id="mi-price" type="number" inputmode="decimal" min="0" placeholder="0" value="' + (editing ? editing.price : "") + '"></div>' +
          '</div>' +
          '<div class="modal-actions">' +
            (editing ? '<button class="btn btn-secondary" data-act="delete-menu-item" data-cat="' + m.catId + '" data-item="' + m.itemId + '">Delete</button>' : '<button class="btn btn-secondary" data-act="close-modal">Cancel</button>') +
            '<button class="btn btn-primary" data-act="submit-item-form">Save</button>' +
          '</div>' +
        '</div></div>';
    }
    if(state.modal.type === "confirm-restore"){
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>Restore this backup?</h3>' +
          '<p>This replaces everything currently on this device \u2014 all tables, sales history, and your menu \u2014 with what\u2019s in the backup file. This can\u2019t be undone.</p>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" data-act="close-modal">Cancel</button>' +
            '<button class="btn btn-primary" data-act="confirm-restore">Restore</button>' +
          '</div>' +
        '</div></div>';
    }
    if(state.modal.type === "import-error"){
      return '<div class="modal-backdrop" data-act="modal-backdrop">' +
        '<div class="modal-card">' +
          '<h3>Couldn\u2019t read that file</h3>' +
          '<p>This doesn\u2019t look like an Order Board backup file. Make sure you\u2019re selecting a file downloaded from "Export All Data."</p>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-primary" data-act="close-modal">OK</button>' +
          '</div>' +
        '</div></div>';
    }
    return "";
  }

  function render(){
    var app = document.getElementById("app");
    var html;
    if(state.view === "order" && state.activeTable) html = renderOrderScreen();
    else if(state.view === "summary") html = renderSummaryScreen();
    else if(state.view === "menu") html = renderMenuScreen();
    else html = renderTablesScreen();
    app.innerHTML = html;
    applyKeyboardOffset();
  }

  // ---------- keep the bottom sheet above the on-screen keyboard ----------
  var currentKeyboardOffset = 0;
  function applyKeyboardOffset(){
    var sheet = document.querySelector(".sheet");
    if(sheet) sheet.style.bottom = currentKeyboardOffset + "px";
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", function(){
      var vv = window.visualViewport;
      var offset = window.innerHeight - vv.height - vv.offsetTop;
      currentKeyboardOffset = offset > 0 ? Math.round(offset) : 0;
      applyKeyboardOffset();
    });
  }

  // ---------- single delegated click handler for the whole app ----------
  document.getElementById("app").addEventListener("click", function(ev){
    var el = ev.target.closest("[data-act]");
    if(!el) return;
    var act = el.getAttribute("data-act");
    var t = el.getAttribute("data-table");
    var idx = el.getAttribute("data-idx");

    if(act === "open-table") openTable(parseInt(t,10));
    else if(act === "go-tables") navigate("tables");
    else if(act === "go-summary") navigate("summary");
    else if(act === "toggle-theme") toggleTheme();
    else if(act === "toggle-sheet") toggleSheet();
    else if(act === "add-item"){
      var iName = el.getAttribute("data-name");
      var iPrice = el.getAttribute("data-price");
      addItem(parseInt(t,10), iName, parseFloat(iPrice));
      var tiles = document.querySelectorAll('.menu-tile[data-act="add-item"]');
      for(var ti=0; ti<tiles.length; ti++){
        if(tiles[ti].getAttribute("data-name") === iName && tiles[ti].getAttribute("data-price") === iPrice){
          (function(node){
            node.classList.add("pop-flash");
            var clear = function(){ node.classList.remove("pop-flash"); };
            node.addEventListener("animationend", clear, { once:true });
            setTimeout(clear, 400);
          })(tiles[ti]);
          break;
        }
      }
    }
    else if(act === "qty-up") changeQty(parseInt(t,10), parseInt(idx,10), 1);
    else if(act === "qty-down") changeQty(parseInt(t,10), parseInt(idx,10), -1);
    else if(act === "add-split") addSplit(parseInt(t,10));
    else if(act === "switch-split") switchSplit(parseInt(idx,10));
    else if(act === "remove-split") removeSplit(parseInt(t,10), parseInt(idx,10));
    else if(act === "open-custom") openCustomForm();
    else if(act === "open-add-table") openAddTableForm();
    else if(act === "submit-add-table") submitAddTable();
    else if(act === "ask-remove-table") askRemoveTable(parseInt(t,10));
    else if(act === "confirm-remove-table") confirmRemoveTable(parseInt(t,10));
    else if(act === "ask-clear") askClearTable(parseInt(t,10));
    else if(act === "confirm-clear") confirmClearTable(parseInt(t,10));
    else if(act === "mark-paid") markPaid(parseInt(t,10));
    else if(act === "close-modal") closeModal();
    else if(act === "submit-custom") submitCustomItem(parseInt(t,10));
    else if(act === "ask-reset") askResetAll();
    else if(act === "confirm-reset") confirmResetAll();
    else if(act === "set-period"){ state.summaryPeriod = el.getAttribute("data-period"); render(); }
    else if(act === "open-export"){ if(periodHistory(state.summaryPeriod).length){ state.modal = { type:"export-menu" }; render(); } }
    else if(act === "do-export-csv"){ closeModal(); exportCSV(); }
    else if(act === "do-export-pdf"){ closeModal(); exportPDF(); }
    else if(act === "open-menu-editor") openMenuEditor();
    else if(act === "close-menu-editor") closeMenuEditor();
    else if(act === "open-add-category") openAddCategoryForm();
    else if(act === "submit-add-category") submitAddCategory();
    else if(act === "delete-menu-cat") deleteMenuCategory(parseInt(el.getAttribute("data-cat"),10));
    else if(act === "add-menu-item") openItemForm(parseInt(el.getAttribute("data-cat"),10));
    else if(act === "edit-menu-item") openItemForm(parseInt(el.getAttribute("data-cat"),10), parseInt(el.getAttribute("data-item"),10));
    else if(act === "delete-menu-item") deleteMenuItem(parseInt(el.getAttribute("data-cat"),10), parseInt(el.getAttribute("data-item"),10));
    else if(act === "submit-item-form") submitItemForm();
    else if(act === "export-all-data") exportAllData();
    else if(act === "trigger-import") triggerImportFile();
    else if(act === "confirm-restore") confirmRestoreBackup();
    else if(act === "modal-backdrop"){ if(ev.target === el) closeModal(); }
  });

  // ---------- live cash/change calculation (no re-render, keeps focus while typing) ----------
  document.getElementById("app").addEventListener("input", function(ev){
    if(!ev.target.matches('[data-act="cash-input"]')) return;
    state.cashInput = ev.target.value;
    var activeSplitObj = (state.tables[state.activeTable] || [])[state.activeSplit];
    var total = activeSplitObj ? splitTotal(activeSplitObj) : 0;
    var cashNum = parseFloat(state.cashInput);
    var displayEl = document.querySelector(".change-display");
    if(!displayEl) return;
    if(state.cashInput === "" || isNaN(cashNum)){
      displayEl.textContent = "";
      displayEl.className = "change-display";
      return;
    }
    var change = cashNum - total;
    if(change < 0){
      displayEl.textContent = "Short " + peso(Math.abs(change));
      displayEl.className = "change-display short";
    } else {
      displayEl.textContent = "Change " + peso(change);
      displayEl.className = "change-display ok";
    }
  });

  document.getElementById("import-file-input").addEventListener("change", function(ev){
    handleImportFile(ev.target);
  });

  render();

  // ---------- register service worker for offline use (only works when hosted, e.g. GitHub Pages) ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){ /* not available, e.g. opened as a local file */ });
    });
  }
})();
</script>
</body>
</html>
