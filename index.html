<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#121110">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Offline order taking, billing and sales tracking for street food stalls.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Order Board">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
  <link rel="apple-touch-icon" href="./app-apple-touch-icon.png">
  <title>Order Board</title>
  <script>
    // Paint the last-used theme before anything loads, so the startup
    // screen never flashes the wrong colour.
    try {
      var t = localStorage.getItem("ob-theme");
      if (t === "light" || t === "dark") {
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "light" ? "#f5f3f0" : "#121110");
      }
    } catch (e) {}
  </script>
  <style>
    /* Startup screen: the same logo, size and position as Android's splash,
       shown until the app is ready, then faded out (see main.tsx). */
    html, body, #splash { margin: 0; background: #121110; }
    html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #splash { background: #f5f3f0; }
    #splash { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; transition: opacity 0.25s ease; }
    #splash svg { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35); }
    #splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Order Board is starting" role="status">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="spl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0614F"/><stop offset="1" stop-color="#B8312C"/></linearGradient>
        <linearGradient id="spl-bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFBF4"/><stop offset="1" stop-color="#F3E6D3"/></linearGradient>
      </defs>
      <rect width="512" height="512" rx="116" fill="url(#spl-bg)"/>
      <g fill="none" stroke="#FFF6EA" stroke-width="22" stroke-linecap="round" opacity="0.92">
        <path d="M196 214c-16-22 14-40 0-66"/><path d="M256 214c-16-26 14-46 0-80"/><path d="M316 214c-16-22 14-40 0-66"/>
      </g>
      <path d="M120 262h272a136 128 0 0 1-272 0z" fill="url(#spl-bowl)"/>
      <rect x="104" y="244" width="304" height="30" rx="15" fill="#FFFBF4"/>
      <rect x="150" y="290" width="212" height="16" rx="8" fill="#F2A93B"/>
      <rect x="214" y="384" width="84" height="18" rx="9" fill="#F3E6D3"/>
    </svg>
  </div>
  <div id="root"></div>
  <noscript>Order Board needs JavaScript to run.</noscript>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
